# Build the images from the projects' source folders instead of pulling them. For trying the whole stack on a
# development machine, or on a server that has the source and enough memory to build:
#
#   docker compose -f compose.yml -f compose.build.yml up -d --build
#
# Expects the projects next to this folder: ../thrice and ../setlet (the studio website's dev folder name).
# Override with THRICE_SRC and SITE_SRC if yours live elsewhere.
services:
  thrice-migrate:
    build: { context: "${THRICE_SRC:-../thrice}" }
  thrice-app:
    build: { context: "${THRICE_SRC:-../thrice}" }
  thrice-worker:
    build: { context: "${THRICE_SRC:-../thrice}" }
  site-migrate:
    build: { context: "${SITE_SRC:-../setlet}", target: tools }
  site-app:
    build: { context: "${SITE_SRC:-../setlet}", target: runner }
