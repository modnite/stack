# One stack for the whole business: THRICE (rental admin), the studio website, one Postgres server with a database
# for each, one Redis, and one Caddy in front. Deploy it anywhere Docker runs.
#
#   cp .env.example .env     # fill in the passwords and domains
#   ./scripts/update.sh      # pulls the images and starts everything
#
# Only Caddy publishes ports. Nothing else is reachable from outside.

name: stack

x-common: &common
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-thrice-env: &thrice-env
  DATABASE_URL: postgresql://thrice:${THRICE_DB_PASSWORD:?Set THRICE_DB_PASSWORD in .env}@postgres:5432/thrice
  REDIS_URL: redis://redis:6379
  NODE_ENV: production
  # Optional. Keeps the key that encrypts saved mail passwords apart from the database.
  APP_SECRET: ${THRICE_APP_SECRET:-}

x-site-env: &site-env
  DATABASE_URL: postgresql://studio-site:${SITE_DB_PASSWORD:?Set SITE_DB_PASSWORD in .env}@postgres:5432/studio
  APP_SECRET: ${SITE_APP_SECRET:?Set SITE_APP_SECRET in .env}
  SITE_DOMAIN: ${SITE_DOMAIN:-}
  SITE_TZ: ${SITE_TZ:-UTC}
  MEDIA_DIR: /data/media

services:
  # ---------------------------------------------------------------- shared data
  postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

  # Makes sure each app has its own database and login. Safe to run every time, on a new or an existing volume.
  db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      THRICE_DB_PASSWORD: ${THRICE_DB_PASSWORD}
      SITE_DB_PASSWORD: ${SITE_DB_PASSWORD}
    volumes:
      - ./scripts/db-init.sh:/db-init.sh:ro
    command: ["sh", "/db-init.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]

  redis:
    <<: *common
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

  # ---------------------------------------------------------------- THRICE
  thrice-migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:?Set IMAGE_OWNER in .env}/thrice:${THRICE_TAG:-latest}
    restart: "no"
    command: ["sh", "docker/entrypoint.sh"]
    environment: *thrice-env
    depends_on:
      db-init: { condition: service_completed_successfully }
    networks: [data]

  thrice-app:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER}/thrice:${THRICE_TAG:-latest}
    environment:
      <<: *thrice-env
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis: { condition: service_healthy }
      thrice-migrate: { condition: service_completed_successfully }
    networks: [data, edge]

  thrice-worker:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER}/thrice:${THRICE_TAG:-latest}
    command: ["sh", "-c", "cd apps/web && exec node_modules/.bin/tsx src/worker/index.ts"]
    environment: *thrice-env
    depends_on:
      redis: { condition: service_healthy }
      thrice-migrate: { condition: service_completed_successfully }
    networks: [data, edge]

  # ---------------------------------------------------------------- studio website
  # Uploads are written as an unprivileged user (uid 1001), but a fresh volume is owned by root.
  site-volume-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    command: ["chown", "-R", "1001:1001", "/data/media"]
    volumes:
      - site_media:/data/media
    networks: [data]

  site-migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER}/studio-site-tools:${SITE_TAG:-latest}
    restart: "no"
    environment:
      <<: *site-env
      SEED_MEDIA_DIR: /app/seed-media
      RUN_SEED_ON_BOOT: ${SITE_RUN_SEED_ON_BOOT:-true}
      # true = fill the website with made-up sample content (a demo). Leave false for a real site.
      SEED_DEMO: ${SITE_SEED_DEMO:-false}
      ADMIN_EMAIL: ${SITE_ADMIN_EMAIL:-}
      ADMIN_NAME: ${SITE_ADMIN_NAME:-}
    volumes:
      - site_media:/data/media
    depends_on:
      db-init: { condition: service_completed_successfully }
      site-volume-init: { condition: service_completed_successfully }
    networks: [data]

  site-app:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER}/studio-site:${SITE_TAG:-latest}
    environment:
      <<: *site-env
      # Caddy is the only way in, so its forwarded headers can be trusted.
      TRUST_PROXY: "true"
      RENTAL_BACKEND: ${SITE_RENTAL_BACKEND:-local}
      # Inside this stack the site reaches THRICE over the private network. Override it in the site's admin if needed.
      THRICE_API_URL: ${SITE_THRICE_API_URL:-http://thrice-app:3000}
      THRICE_API_KEY: ${SITE_THRICE_API_KEY:-}
      SMTP_HOST: ${SITE_SMTP_HOST:-}
      SMTP_PORT: ${SITE_SMTP_PORT:-587}
      SMTP_USER: ${SITE_SMTP_USER:-}
      SMTP_PASS: ${SITE_SMTP_PASS:-}
      SMTP_REQUIRE_TLS: ${SITE_SMTP_REQUIRE_TLS:-true}
      SMTP_FROM: ${SITE_SMTP_FROM:-}
      NOTIFY_EMAIL: ${SITE_NOTIFY_EMAIL:-}
      TURNSTILE_SITE_KEY: ${SITE_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${SITE_TURNSTILE_SECRET_KEY:-}
      LOG_LEVEL: ${SITE_LOG_LEVEL:-info}
    volumes:
      - site_media:/data/media
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    depends_on:
      site-migrate: { condition: service_completed_successfully }
    networks: [data, edge]

  # ---------------------------------------------------------------- front door
  caddy:
    <<: *common
    image: caddy:2-alpine
    environment:
      ADMIN_ADDR: ${ADMIN_ADDR:-${ADMIN_DOMAIN:-:8080}}
      SITE_ADDR: ${SITE_ADDR:-${SITE_DOMAIN:-:8081}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
      # Used when there are no domains yet (a LAN test box). Loopback only unless LAN_BIND=0.0.0.0.
      - "${LAN_BIND:-127.0.0.1}:${ADMIN_PORT:-8080}:8080"
      - "${LAN_BIND:-127.0.0.1}:${SITE_PORT:-8081}:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - thrice-app
      - site-app
    networks: [edge]

  # ---------------------------------------------------------------- backups
  # Nightly dump of both databases and the website's uploads. Written to a temp name and renamed only on success.
  backup:
    <<: *common
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - backups:/backups
      - site_media:/media:ro
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    command: ["sh", "/backup-loop.sh"]
    depends_on:
      postgres: { condition: service_healthy }
      # The databases must exist before the first dump.
      db-init: { condition: service_completed_successfully }
    networks: [data]

  # Optional: copies the backups off this machine. Enable with COMPOSE_PROFILES=offsite and the RCLONE_* settings
  # in .env (see .env.example). Any storage rclone supports works: Hetzner Storage Box, Backblaze B2, S3, Drive.
  offsite:
    <<: *common
    profiles: [offsite]
    image: rclone/rclone:latest
    environment:
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_KEY_SECRET:-}
      RCLONE_CONFIG_OFFSITE_ACCOUNT: ${RCLONE_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_KEY: ${RCLONE_KEY_SECRET:-}
      RCLONE_CONFIG_OFFSITE_HOST: ${RCLONE_HOST:-}
      RCLONE_CONFIG_OFFSITE_USER: ${RCLONE_USER:-}
      RCLONE_CONFIG_OFFSITE_PASS: ${RCLONE_PASS_OBSCURED:-}
    volumes:
      - backups:/backups:ro
      - ./scripts/offsite-loop.sh:/offsite-loop.sh:ro
    entrypoint: ["sh", "/offsite-loop.sh"]
    depends_on:
      - backup
    networks: [edge]

networks:
  # Database side. No route to the internet: Postgres and Redis can't phone home and nothing outside reaches them.
  data:
    internal: true
  # Web side. Caddy talks to the apps here, and the apps reach email and other services from here.
  edge: {}

volumes:
  pg_data:
  redis_data:
  site_media:
  caddy_data:
  caddy_config:
  backups:
